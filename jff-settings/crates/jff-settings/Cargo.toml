[package]
name = "jff-settings"
description = "GTK4 / libadwaita settings for the jff compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jff-settings-core = { path = "../jff-settings-core" }
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
